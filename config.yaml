# YAML file for configuration

project_name: "Analisis_Bioinformatico_01"

# 1. Data
data:
  raw_path: "data/data_breast_cancer.csv"        # Input data
  target_column: "diagnosis"          # Target variable (for prediction)
  index_column: "id"           # Index column name for samples if it exists (to not treat it as a variable)
  drop_columns: ["Unnamed: 32"]    # Columns to be excluded from analysis

# 2. Processing parameters
preprocessing:
  log_transform: true                 # Nomalisation
  scaling: "standard"                 # Scaling options: standard, minmax, robust
  impute_missing: "median"            # Input missing data as (mean, median, zero)
  test_size: 0.2                      # Train test partition size

# 3. Exploratory analisis (EDA)
eda:
  correlation_threshold: 0.9          # Correlation threshold
  top_n_features: 20                  # Max features to be included
  top_n_categories: 20                # Max categories to be included
  generate_pca: true                  # Option to use PCA
  pca_components: 3                   # Total components to calculate

# 4. Models to be trained
models:
  - "random_forest"
  - "logistic_regression"
  - "svm"
  - "knn"

# 4b. Model training settings
model_training:
  task_type: "auto"                # auto, classification, regression
  cv_folds: 5                     # Cross-validation folds
  scoring_metric: "f1_weighted"   # Classification: accuracy, f1_weighted, roc_auc | Regression: r2, neg_mean_squared_error
  use_tuning: true                # Enable/disable hyperparameter tuning (GridSearchCV)
  # hyperparameters:              # Optional: override default grids per model
  #   random_forest:
  #     n_estimators: [50, 100, 200]
  #     max_depth: [null, 10, 20]
  #   logistic_regression:
  #     C: [0.01, 0.1, 1, 10]
  #   svm:
  #     C: [0.1, 1, 10]
  #     kernel: ["rbf", "linear"]
  #   knn:
  #     n_neighbors: [3, 5, 7, 11]

# 5. Output
output:
  dir: "results/"
  save_plots: true
  save_models: true

# 6. RNA-Seq pipeline settings
rnaseq:
  enabled: false                       # Set to true to activate the RNA-Seq pipeline
  count_data_path: "data/counts.csv"   # Raw count matrix: samples as rows, genes as columns
  metadata_path: "data/metadata.csv"   # Sample metadata CSV with a condition column
  target_col: "condition"              # Column in metadata used to define groups
  min_cpm: 1.0                         # CPM threshold for low-expression gene filtering
  min_samples: 3                       # Min samples that must meet the CPM threshold
  log2fc_thresh: 1.0                   # Absolute log2 fold-change cutoff for DEA significance
  fdr_thresh: 0.05                     # Benjamini-Hochberg adjusted p-value cutoff
  group_a: "Control"                   # Reference group label (denominator of log2FC)
  group_b: "Treated"                   # Comparison group label (numerator of log2FC)
  enrichment_db: "KEGG_2021_Human"     # gseapy Enrichr library name for ORA (set to "" to skip)

# 7. PyTorch deep learning settings
deep_learning:
  enabled: false                       # Set to true to activate DL (requires rnaseq.enabled: true)
  model_type: "mlp"                    # Options: mlp (supervised) | vae (unsupervised dim. reduction)
  hidden_dims: [512, 256, 128]         # Hidden layer sizes for MLP; encoder dims for VAE
  latent_dim: 32                       # Latent space dimensions (VAE only)
  epochs: 100                          # Maximum training epochs
  learning_rate: 0.001                 # Adam optimiser learning rate
  dropout: 0.3                         # Dropout probability (MLP only)
  batch_size: 32                       # Mini-batch size
  early_stopping_patience: 10          # MLP: epochs without val-loss improvement before stopping
